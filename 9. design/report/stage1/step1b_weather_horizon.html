<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1단계 보충 · 기상 예보 받기(기준시각과 지평)</title>
<!-- 시스템 폰트(맑은 고딕) · 흰 배경 — 흰 문서 삽입용 -->
<style>
  :root{ --paper:#ffffff; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
         --accent:#eb6c36; --rule:rgba(45,49,66,0.12); }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--paper); color:#1a1a1a;
        font-family:'Malgun Gothic','맑은 고딕',sans-serif;
        display:flex; justify-content:center; padding:2rem 1rem; }
  .wrap{width:100%; max-width:760px}
  .eyebrow{font-size:8px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase;
           color:var(--accent); margin:0 0 0.4rem;}
  h1{font-weight:700; font-size:1.55rem; margin:0 0 0.3rem; line-height:1.15;}
  .sub{font-size:12.5px; color:#1a1a1a; margin:0 0 1rem; line-height:1.55;}
  svg{width:100%; height:auto; display:block}
  .note{font-size:11px; color:var(--muted); margin:0.6rem 0 0; line-height:1.5;}
  footer{margin-top:1rem; padding-top:0.6rem; border-top:1px solid var(--rule);
         font-size:8px; letter-spacing:0.12em; color:#1a1a1a; text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기상 예보 지평 그림"></svg>
  <p class="note" id="note"></p>
  <footer id="footer"></footer>
</div>

<!-- ====================================================================== -->
<!--  ▼▼▼  여기만 고치면 됩니다 — 숫자·라벨만 바꾸면 그림이 다시 그려집니다  ▼▼▼ -->
<!-- ====================================================================== -->
<script>
  const META = {
    eyebrow:  "STEP 1 보충 · 기상 예보 받기",
    title:    "기상 예보 받기 — 기준시각과 지평(앞으로 며칠까지)",
    subtitle: "예보는 ‘기준시각’(발표 시점)부터 앞으로 며칠까지를 한 번에 제공하며, 하루 4번(한국시간 09·15·21·03시) 새로 발표됩니다. "
            + "가까운 시점은 촘촘하게(1시간 간격), 먼 시점은 성기게(3시간 간격) 들어옵니다.",
    note:     "* 제주는 가까운 5일(D+5)까지 더 촘촘한 지역 예보를 추가로 활용합니다.",
    footer:   "데이터 수집·관리 · 1단계 보충(기상 예보 수신) · 2026-06",
  };

  // 핵심 숫자 — 코드 기준(_common.py)
  const D = {
    hourlyMaxH: 135,   // 1시간 간격 한계(시간)
    maxH:       372,   // 3시간 간격 한계(시간) ≈ 15.5일
    targetD:    15,    // 예측 목표 지평 (D+15 = 360시간)
    dayTicks:   [1, 5, 10, 15],   // 축에 표시할 D+n
    issueText:  "하루 4회 발표 · 한국시간 09·15·21·03시",
  };

  // 아래 흐름(보간 → 입력) 라벨
  const FLOW = [
    { n:"받은 예보값",     sub:["앞부분 1시간 간격", "뒷부분 3시간 간격"], type:"data"  },
    { n:"보간 처리",       sub:["3시간 구간을", "1시간 간격으로 채움"],   type:"focal" },
    { n:"예측 모델 입력",  sub:["1시간 간격으로 통일", "D+15까지"],       type:"model" },
  ];
  // ====================================================================== //
  // ▲▲▲  보통은 여기까지만 수정하면 됩니다  ▲▲▲                              //
  // ====================================================================== //


  // ── 렌더링 ─────────────────────────────────────────────────
  const T = { paper:'#ffffff', ink:'#2d3142', muted:'#4f5d75', soft:'#7a8399',
              accent:'#eb6c36', accentTint:'rgba(235,108,54,0.10)',
              accentLine:'rgba(235,108,54,0.55)', rule:'rgba(45,49,66,0.12)',
              store:'rgba(45,49,66,0.05)', tick:'rgba(45,49,66,0.45)' };
  const FONT = "'Malgun Gothic','맑은 고딕',sans-serif";
  const TEXT = '#1a1a1a';
  const STYLE = {
    focal: { fill:T.accentTint, stroke:T.accent },
    data:  { fill:T.store,      stroke:T.muted  },
    model: { fill:'#ffffff',    stroke:T.ink    },
  };
  const esc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const t=(x,y,s,{size=12,col=TEXT,w=600,anc='middle',ls=0}={})=>
    `<text x="${x}" y="${y}" fill="${col}" font-size="${size}" font-weight="${w}" `+
    `font-family="${FONT}" text-anchor="${anc}" letter-spacing="${ls}em">${esc(s)}</text>`;

  function build(){
    const vbW=720;
    const axX0=112, axX1=684;
    const scale=(axX1-axX0)/D.maxH;
    const xOf=(h)=>axX0+h*scale;
    const splitX=xOf(D.hourlyMaxH);
    const barY=156, barH=46, barB=barY+barH;

    let s='';

    // ── 상단 지평 막대 ──
    // 구역 박스
    s += `<rect x="${axX0}" y="${barY}" width="${splitX-axX0}" height="${barH}" rx="5" fill="${T.accentTint}" stroke="${T.accentLine}" stroke-width="1"/>`;
    s += `<rect x="${splitX}" y="${barY}" width="${axX1-splitX}" height="${barH}" rx="5" fill="${T.store}" stroke="${T.muted}" stroke-width="1"/>`;

    // 눈금(밀도 대비: 1시간=촘촘, 3시간=성김) — 대표 간격으로 표시
    for(let h=6; h<D.hourlyMaxH; h+=6){
      const x=xOf(h);
      s += `<line x1="${x}" y1="${barY+9}" x2="${x}" y2="${barB-9}" stroke="${T.accentLine}" stroke-width="0.8"/>`;
    }
    for(let h=D.hourlyMaxH+18; h<D.maxH; h+=18){
      const x=xOf(h);
      s += `<line x1="${x}" y1="${barY+9}" x2="${x}" y2="${barB-9}" stroke="${T.tick}" stroke-width="0.8"/>`;
    }

    // 구역 라벨(위)
    const cA=(axX0+splitX)/2, cB=(splitX+axX1)/2;
    s += t(cA, barY-26, "1시간 간격", {size:12.5,col:T.accent,w:700});
    s += t(cA, barY-11, "최대 135시간 까지", {size:9.5,col:T.muted,w:400});
    s += t(cB, barY-26, "3시간 간격", {size:12.5,col:T.ink,w:700});
    s += t(cB, barY-11, "최대 372시간(약 15.5일)", {size:9.5,col:T.muted,w:400});

    // 기준시각 표시(왼쪽 시작점)
    s += `<line x1="${axX0}" y1="${barY-4}" x2="${axX0}" y2="${barB+34}" stroke="${T.accent}" stroke-width="1.4"/>`;
    s += `<polygon points="${axX0},${barY+barH/2-6} ${axX0+9},${barY+barH/2} ${axX0},${barY+barH/2+6}" fill="${T.accent}"/>`;
    s += t(axX0-8, barY+18, "기준 시각", {size:11,col:TEXT,w:700,anc:'end'});
    s += t(axX0-8, barY+33, "ex) 2026-06-01", {size:9.5,col:T.muted,w:400,anc:'end'});

    // 하단 D+ 눈금
    D.dayTicks.forEach(d=>{
      const x=xOf(d*24), focal=(d===D.targetD);
      s += `<line x1="${x}" y1="${barB}" x2="${x}" y2="${barB+7}" stroke="${focal?T.accent:T.muted}" stroke-width="${focal?1.4:1}"/>`;
      s += t(x, barB+21, "D+"+d, {size:focal?11:10,col:focal?T.accent:TEXT,w:focal?700:500});
    });
    s += t(xOf(D.targetD*24), barB+35, "예측 한계", {size:9,col:T.accent,w:600,ls:0.04});
    s += t(xOf(D.targetD*24), barB+48, "ex) 2026-06-16", {size:9,col:T.accent,w:600,ls:0.04});

    // ── 가운데 구분선 ──
    const divY=barB+60;
    s += `<line x1="${axX0-40}" y1="${divY}" x2="${axX1+12}" y2="${divY}" stroke="${T.rule}" stroke-width="0.8"/>`;
    s += t(72, divY+18, "모델에 넣기 전 처리", {size:8.5,col:T.soft,w:600,ls:0.12,anc:'start'});

    // ── 하단 흐름: 받은 예보 → 보간 → 모델 입력 ──
    const bW=196, bH=62, gap=44, fY=divY+30;
    const totalW=FLOW.length*bW+(FLOW.length-1)*gap;
    const startX=(vbW-totalW)/2;
    const pos=FLOW.map((_,i)=>startX+i*(bW+gap));

    // 화살표 먼저
    for(let i=0;i<FLOW.length-1;i++){
      const x1=pos[i]+bW, x2=pos[i+1]-4, y=fY+bH/2;
      s += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${T.muted}" stroke-width="1" marker-end="url(#arrow)"/>`;
    }
    // 박스
    FLOW.forEach((b,i)=>{
      const x=pos[i], st=STYLE[b.type]||STYLE.model, cx=x+bW/2;
      s += `<rect x="${x}" y="${fY}" width="${bW}" height="${bH}" rx="6" fill="${T.paper}"/>`+
           `<rect x="${x}" y="${fY}" width="${bW}" height="${bH}" rx="6" fill="${st.fill}" stroke="${st.stroke}" stroke-width="1"/>`;
      s += t(cx, fY+24, b.n, {size:12.5,col:TEXT,w:700});
      b.sub.forEach((ln,j)=>{ s += t(cx, fY+40+j*14, ln, {size:9.5,col:T.muted,w:400}); });
    });

    const vbH=fY+bH+24;
    const svg=document.getElementById('diagram');
    svg.setAttribute('viewBox',`0 0 ${vbW} ${vbH}`);
    svg.innerHTML =
      `<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">`+
      `<polygon points="0 0, 8 3, 0 6" fill="${T.muted}"/></marker></defs>`+
      `<rect width="100%" height="100%" fill="${T.paper}"/>`+ s;

    document.getElementById('eyebrow').textContent  = META.eyebrow;
    document.getElementById('title').textContent    = META.title;
    document.getElementById('subtitle').textContent = META.subtitle;
    document.getElementById('note').textContent     = META.note;
    document.getElementById('footer').textContent   = META.footer;
  }
  build();
</script>
</body>
</html>

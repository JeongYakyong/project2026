<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5단계 · 수요 예측 모델 구조 (단일 모델)</title>
<!-- 시스템 폰트(맑은 고딕) · 흰 배경 — 흰 문서 삽입용 -->
<style>
  :root{ --paper:#ffffff; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
         --accent:#eb6c36; --rule:rgba(45,49,66,0.12); }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--paper); color:#1a1a1a;
        font-family:'Malgun Gothic','맑은 고딕',sans-serif;
        display:flex; justify-content:center; padding:2rem 1rem; }
  .wrap{width:100%; max-width:760px}
  .eyebrow{font-size:8px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase;
           color:var(--accent); margin:0 0 0.4rem;}
  h1{font-weight:700; font-size:1.6rem; margin:0 0 0.3rem; line-height:1.15;}
  .sub{font-size:12.5px; color:#1a1a1a; margin:0 0 1rem; line-height:1.55;}
  svg{width:100%; height:auto; display:block}
  .note{font-size:11px; color:var(--muted); margin:0.6rem 0 0; line-height:1.5;}
  footer{margin-top:1rem; padding-top:0.6rem; border-top:1px solid var(--rule);
         font-size:8px; letter-spacing:0.12em; color:#1a1a1a; text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="수요 예측 모델 구조"></svg>
  <p class="note" id="note"></p>
  <footer id="footer"></footer>
</div>

<!-- ====================================================================== -->
<!--  ▼▼▼  여기만 고치면 됩니다 — 좌표·화살표는 자동 계산됩니다  ▼▼▼          -->
<!-- ====================================================================== -->
<script>
  const META = {
    eyebrow:  "STEP 5 · 수요 예측 모델 구조",
    title:    "최근 실측에 모델이 '차이'만 더합니다",
    subtitle: "수요의 큰 틀(기준선)은 최근 실측이 알려주고, 딥러닝 모델은 날씨 때문에 생기는 "
            + "작은 차이만 맞춥니다. 그래서 먼 미래까지도 크게 어긋나지 않습니다.",
    note:     "* 예: 지난 같은 요일 100 + 날씨 차이 +5 = 105 → (먼 미래는 보정 ×0.98) → 103 MW. "
            + "예측 거리 D+1~15는 같은 구조 15벌이며, 한낮 과대(태양광)는 가까운 미래(D+1~6)는 모델 미세조정으로, "
            + "먼 미래(D+7~15)는 보정표로 바로잡습니다.",
    footer:   "전국 수요 예측 · 5단계 단일 모델(v4) · 2026-06",
  };

  // 하단 2구간 띠 — 지평별 교정 방식 (한낮 과대 바로잡기)
  const ZONE_HEAD = "한낮 과대(태양광 급증)를 예측 거리에 따라 다르게 바로잡습니다";
  const ZONES = [
    { frac:0.40, acc:true,  title:"가까운 미래 · D+1~6", desc:"모델을 새 데이터로 미세조정(파인튜닝)" },
    { frac:0.60, acc:false, title:"먼 미래 · D+7~15",    desc:"후처리 보정표로 교정" },
  ];

  // 열(왼→오) · 각 열의 박스(위→아래). type: data | model | focal | store
  const COLS = [
    { head:"입력", boxes:[
        { id:"past", n:"과거 수요·날씨", sub:["최근 실측 기록"],     type:"data" },
        { id:"fut",  n:"미래 날씨 예보", sub:["앞으로 15일"],        type:"data" },
        { id:"lvl",  n:"최근 같은 요일 수요", sub:["기준선 재료"],   type:"data" },
    ]},
    { head:"두 갈래로 계산", boxes:[
        { id:"anchor", n:"① 기준선 잡기", sub:["최근 같은 요일 실측 평균","태양광·계절 변화 자동 반영"], type:"model" },
        { id:"resid",  n:"② 차이 학습 (딥러닝)", sub:["날씨로 생기는 작은 출렁임만","더하거나 뺀다"],     type:"model" },
    ]},
    { head:"합치기", boxes:[
        { id:"sum", n:"기준선 + 차이", sub:["= 예측 수요"], type:"focal" },
    ]},
    { head:"마무리 · 저장", boxes:[
        { id:"calib", n:"③ 지평별 교정", sub:["가까운/먼 미래","방식이 다름 ↓"], type:"model" },
        { id:"out",   n:"예측 결과", sub:["시점별 · 지평별 수요"], type:"store" },
    ]},
  ];

  // 화살표: [출발 id, 도착 id, 라벨(생략 가능)]
  const EDGES = [
    ["past","resid"], ["fut","resid"], ["lvl","anchor"],
    ["anchor","sum"], ["resid","sum"],
    ["sum","calib"], ["calib","out"],
  ];

  const LEGEND = [
    { type:"data",  label:"입력 데이터" },
    { type:"model", label:"처리 단계" },
    { type:"focal", label:"핵심: 합산" },
    { type:"store", label:"저장" },
  ];
  // ====================================================================== //
  // ▲▲▲  보통은 여기까지만 수정하면 됩니다  ▲▲▲                              //
  // ====================================================================== //

  const T = { paper:'#ffffff', ink:'#2d3142', muted:'#4f5d75', soft:'#7a8399',
              accent:'#eb6c36', accentTint:'rgba(235,108,54,0.08)',
              rule:'rgba(45,49,66,0.12)', store:'rgba(45,49,66,0.05)',
              stage:'rgba(45,49,66,0.035)', ext:'rgba(45,49,66,0.03)', extStroke:'rgba(45,49,66,0.32)' };
  const FONT = "'Malgun Gothic','맑은 고딕',sans-serif";
  const TEXT = '#1a1a1a';
  const STYLE = {
    focal:{fill:T.accentTint,stroke:T.accent}, data:{fill:T.store,stroke:T.muted},
    external:{fill:T.ext,stroke:T.extStroke}, store:{fill:T.store,stroke:T.muted},
    model:{fill:'#ffffff',stroke:T.ink},
  };
  const CFG = { nodeW:162, colGapX:46, padX:24, padTop:78, vGap:22, footPad:44 };
  const esc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const t=(x,y,s,{size=12,col=TEXT,w=600,anc='middle',ls=0}={})=>
    `<text x="${x}" y="${y}" fill="${col}" font-size="${size}" font-weight="${w}" `+
    `font-family="${FONT}" text-anchor="${anc}" letter-spacing="${ls}em">${esc(s)}</text>`;
  function boxH(b){ return 40 + (b.sub||[]).length*14; }
  function build(){
    const { nodeW,colGapX,padX,padTop,vGap,footPad } = CFG;
    const colH = COLS.map(c=>c.boxes.reduce((s,b)=>s+boxH(b),0)+(c.boxes.length-1)*vGap);
    const maxColH = Math.max(...colH);
    const vbW = padX*2 + COLS.length*nodeW + (COLS.length-1)*colGapX;
    const bandH = 46, headGap = 30;
    const headerY = padTop + maxColH + headGap;
    const bandTop = headerY + 12;
    const legendY = bandTop + bandH + 28, vbH = legendY + footPad;
    const pos={};
    COLS.forEach((c,ci)=>{ const x=padX+ci*(nodeW+colGapX); let y=padTop+(maxColH-colH[ci])/2;
      c._headY=y-14; c._headX=x+nodeW/2;
      c.boxes.forEach(b=>{ const h=boxH(b); pos[b.id]={x,y,w:nodeW,h,cx:x+nodeW/2,cy:y+h/2,left:x,right:x+nodeW}; y+=h+vGap; }); });
    let arrows='',labels='',boxes='',heads='';
    EDGES.forEach(([f,to,lab])=>{ const a=pos[f],b=pos[to]; if(!a||!b)return;
      const x1=a.right,y1=a.cy,x2=b.left-4,y2=b.cy;
      const isAcc = (f==='sum'||to==='sum');
      const col = isAcc?T.accent:T.muted, mk = isAcc?'arrow-acc':'arrow', sw = isAcc?1.4:1;
      arrows+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" marker-end="url(#${mk})"/>`;
      if(lab){ const mx=(x1+x2)/2,my=(y1+y2)/2,w=lab.length*8+12;
        labels+=`<rect x="${mx-w/2}" y="${my-19}" width="${w}" height="14" rx="2" fill="${T.paper}"/>`+t(mx,my-8,lab,{size:8.5,col:T.accent,w:600,ls:0.04}); } });
    COLS.forEach(c=>{ heads+=t(c._headX,c._headY,c.head,{size:8.5,col:T.soft,w:600,ls:0.12}); });
    COLS.forEach(c=>c.boxes.forEach(b=>{ const p=pos[b.id],s=STYLE[b.type]||STYLE.model,hasSub=(b.sub||[]).length>0;
      boxes+=`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6" fill="${T.paper}"/>`+
             `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6" fill="${s.fill}" stroke="${s.stroke}" stroke-width="1"/>`;
      boxes+=t(p.cx, hasSub?p.y+22:p.cy+4, b.n, {size:12.5,col:TEXT,w:700});
      (b.sub||[]).forEach((ln,i)=>{ boxes+=t(p.cx,p.y+38+i*14,ln,{size:10,col:T.muted,w:400}); }); }));
    // 지평별 교정 2구간 띠
    let example=t(vbW/2, headerY, ZONE_HEAD, {size:9.5,col:T.soft,w:600,ls:0.01});
    let zx=padX; const bTotW=vbW-padX*2, bgap=8;
    ZONES.forEach(z=>{ const zw=(bTotW-bgap)*z.frac, f=z.acc?T.accentTint:T.store, st=z.acc?T.accent:T.muted;
      example+=`<rect x="${zx}" y="${bandTop}" width="${zw}" height="${bandH}" rx="6" fill="${T.paper}"/>`+
               `<rect x="${zx}" y="${bandTop}" width="${zw}" height="${bandH}" rx="6" fill="${f}" stroke="${st}" stroke-width="1.2"/>`;
      example+=t(zx+zw/2, bandTop+19, z.title, {size:11,col:'#1a1a1a',w:700});
      example+=t(zx+zw/2, bandTop+36, z.desc, {size:9,col:T.muted,w:400});
      zx+=zw+bgap; });
    let legend=`<line x1="${padX}" y1="${legendY}" x2="${vbW-padX}" y2="${legendY}" stroke="${T.rule}" stroke-width="0.8"/>`;
    let lx=padX,ly=legendY+10;
    LEGEND.forEach(it=>{ const s=STYLE[it.type]||STYLE.model;
      legend+=`<rect x="${lx}" y="${ly}" width="12" height="12" rx="2" fill="${s.fill}" stroke="${s.stroke}" stroke-width="1"/>`+
              t(lx+16,ly+10,it.label,{size:8.5,col:TEXT,w:500,anc:'start',ls:0.03}); lx+=it.label.length*13+40; });
    const svg=document.getElementById('diagram'); svg.setAttribute('viewBox',`0 0 ${vbW} ${vbH}`);
    svg.innerHTML=`<defs>`+
      `<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="${T.muted}"/></marker>`+
      `<marker id="arrow-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="${T.accent}"/></marker>`+
      `</defs>`+
      `<rect width="100%" height="100%" fill="${T.paper}"/>`+arrows+labels+heads+boxes+example+legend;
    for(const k of ['eyebrow','title','subtitle','note','footer']) document.getElementById(k).textContent=META[k]||'';
  }
  build();
</script>
</body>
</html>
